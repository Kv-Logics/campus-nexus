spring.application.name=campus-nexus
server.port=8080

# File Upload Limits (e.g. 500MB)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Staging Storage Directory
app.storage.staging-dir=./staging
app.storage.worker-threads=10
app.storage.max-retry-attempts=3

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/campusnexus;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Logging
logging.level.com.kvlogics=INFO
