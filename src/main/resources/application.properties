spring.application.name=campus-nexus
server.port=8080

# File Upload Limits (e.g. 500MB)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Staging Storage Directory
app.storage.staging-dir=./staging
app.storage.worker-threads=10
app.storage.max-retry-attempts=3

# Mock FTP Cluster (Disabled by default)
app.mock-ftp.auto-start=false

# MongoDB Atlas Configuration (Inject via environment variable SPRING_DATA_MONGODB_URI)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/campus_nexus}

# Logging
logging.level.com.kvlogics=INFO
